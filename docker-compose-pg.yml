# Production — PostgreSQL replaces H2 for Data Agent analysis
# JPA entities (conversations/tasks/plans) remain on H2 embedded.
# The Data Agent's NL2SQL targets the external PostgreSQL via data-agent.datasource.
#
# Usage:
#   export LLM_API_KEY=sk-ant-xxx
#   export PG_PASSWORD=changeme
#   docker compose -f docker-compose-pg.yml up --build
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agentdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JAVA_OPTS: "-Xmx768m -XX:+UseG1GC"
    volumes:
      - agent_memory:/home/appuser/.java-code-agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pg_data:
  agent_memory:
