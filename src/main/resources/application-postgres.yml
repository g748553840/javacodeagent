# PostgreSQL profile — activated by SPRING_PROFILES_ACTIVE=postgres (see docker-compose-pg.yml)
#
# Architecture:
#   - Spring JPA entities (conversations / tasks / plans / messages) → H2 embedded (unchanged)
#   - Data Agent NL2SQL analysis queries → external PostgreSQL via data-agent.datasource
#   - Excel/CSV import → H2 embedded (unchanged, uses in-memory tables)
#
# This separation means the agent's internal state is always portable (H2),
# while production data analysis targets the PostgreSQL database.

data-agent:
  dialect: postgresql
  db-name: ${POSTGRES_DB:agentdb}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:agentdb}
    username: ${POSTGRES_USER:agent}
    # 不提供默认密码：与 docker-compose-pg.yml 的 ${POSTGRES_PASSWORD:?...} 保持一致，
    # 强制要求显式配置，避免脱离 docker-compose 直接以 java -jar 启动时静默落到
    # 一个公开可猜的默认密码（历史上此处曾是 :agentsecret）。
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

logging:
  level:
    com.javacodeagent: INFO
