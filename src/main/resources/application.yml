spring:
  application:
    name: java-code-agent
  # 强制使用 Reactive（Netty）服务器，防止 spring-boot-starter-data-jpa 拉入
  # Tomcat 后 Spring Boot 误判为 Servlet 模式，导致 WebFilter / WebFlux 失效
  main:
    web-application-type: reactive

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Excel/CSV 上传大小上限：无此配置时 WebFlux 默认不限制单个 part 大小，
  # 配合 ExcelAnalysisController 手写的字节数组拼接（O(n²)）可被超大文件拖垮内存/CPU
  webflux:
    multipart:
      max-in-memory-size: 10MB
      max-disk-usage-per-part: -1

llm:
  # ── Anthropic Claude（默认）──────────────────────────────────────────────────
  provider: anthropic
  # 未设置 LLM_API_KEY 时留空，请求会返回 401，日志中可明确识别
  api-key: ${LLM_API_KEY:}
  model: claude-opus-4-8
  max-tokens: 16384
  temperature: 0.7
  endpoint: https://api.anthropic.com
  system-prompt: "You are an AI coding assistant with access to tools for reading, writing, and executing code. You are precise, efficient, and help users accomplish software engineering tasks."
  thinking-enabled: false

  # ── DeepSeek ─────────────────────────────────────────────────────────────────
  # provider: deepseek
  # api-key: ${LLM_API_KEY:your-deepseek-key}
  # model: deepseek-chat          # 或 deepseek-reasoner
  # max-tokens: 8192
  # temperature: 0.7
  # endpoint: https://api.deepseek.com/v1   # 可省略，会自动推断

  # ── 智谱 GLM / ChatGLM ───────────────────────────────────────────────────────
  # provider: glm
  # api-key: ${LLM_API_KEY:your-zhipu-key}
  # model: glm-4-plus             # 或 glm-4-flash、glm-4-air
  # max-tokens: 8192
  # temperature: 0.7
  # endpoint: https://open.bigmodel.cn/api/paas/v4   # 可省略

  # ── 阿里云通义 Qwen ───────────────────────────────────────────────────────────
  # provider: qwen
  # api-key: ${LLM_API_KEY:your-dashscope-key}
  # model: qwen-max               # 或 qwen-plus、qwen-turbo
  # max-tokens: 8192
  # temperature: 0.7
  # endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1   # 可省略

  # ── 标准 OpenAI ──────────────────────────────────────────────────────────────
  # provider: openai
  # api-key: ${LLM_API_KEY:your-openai-key}
  # model: gpt-4o
  # max-tokens: 16384
  # temperature: 0.7
  # endpoint: https://api.openai.com/v1   # 可省略

  # ── 任意 OpenAI 兼容接口（如本地 Ollama、vLLM 等）──────────────────────────
  # provider: custom
  # api-key: ${LLM_API_KEY:optional}
  # model: your-model-name
  # max-tokens: 4096
  # temperature: 0.7
  # endpoint: http://localhost:11434/v1   # 必须填写完整 base URL

permissions:
  default-level: SAFE
  auto-approve:
    - file-read    # FILE_READ — Read/Glob/Grep/List 工具使用此权限
    - database-read  # DATABASE_READ — SqlQueryTool 使用此权限

memory:
  enabled: true
  location: ${user.home}/.java-code-agent/memory
  index-file: MEMORY.md
  # ── 向量语义记忆检索（可选，默认关闭）──────────────────────────────────────
  # 启用后，POST /memory 时异步生成 embedding，GET /memory/{userId}/search?mode=semantic
  # 使用余弦相似度排序替代关键词匹配。
  # 兼容任何 OpenAI Embeddings API（/v1/embeddings）格式的服务：
  #   OpenAI / Azure OpenAI / 阿里云通义 / DeepSeek / Ollama(v0.4+) / LM Studio / vLLM
  embedding:
    enabled: false
    provider: openai                       # 仅用于日志说明
    api-key: ${LLM_API_KEY:}              # 与 llm.api-key 共用同一 key 即可
    model: text-embedding-3-small          # OpenAI: text-embedding-3-small(1536dim) / ada-002(1536dim)
    endpoint: https://api.openai.com/v1   # 替换为实际服务基础 URL
    dimensions: 1536                       # 必须与 model 实际输出维度一致
    top-k: 5                               # 语义检索默认返回条数
    similarity-threshold: 0.5             # 余弦相似度阈值(0~1)，低于此值不返回

agents:
  enabled: true
  max-concurrent: 5

agent:
  max-tool-call-depth: 50

skills:
  enabled: true
  location: ${user.home}/.java-code-agent/skills

hooks:
  enabled: true

context:
  compression:
    enabled: true
    threshold: 40
    keep-recent: 10

tasks:
  enabled: true
  max-concurrent: 10

security:
  # ── API Key 认证（简单模式）────────────────────────────────────────────────
  # 留空或不配置则关闭 API Key 认证；配置后所有 API 请求须携带：
  #   Authorization: Bearer <api-key>  或  X-API-Key: <api-key>
  api-key: ${AGENT_API_KEY:}

  # ── JWT 认证（生产模式，优先于 API Key）──────────────────────────────────
  # 配置 secret 后，JWT 模式自动激活，API Key 认证退化为 fallback。
  # userId 从 JWT sub claim 提取，无需客户端传递 X-User-Id 头。
  # 生成令牌：POST /api/v1/auth/token {"userId":"alice"}（需配置 secret）
  jwt:
    secret: ${JWT_SECRET:}          # 至少 32 字符；留空则禁用 JWT 认证
    ttl-hours: ${JWT_TTL_HOURS:24}  # 令牌有效期（小时），默认 24h

  # ── CORS 跨域白名单 ──────────────────────────────────────────────────────
  # 留空则不注册跨域映射，浏览器跨域请求按同源策略被拒绝（默认最安全）。
  # 需要独立前端跨域访问时，显式列出允许的来源（逗号分隔），不支持通配符 "*"，
  # 避免与 JWT/API Key 认证组合时任意网站可窃取受保护响应数据。
  cors:
    allowed-origins: ${AGENT_CORS_ALLOWED_ORIGINS:}

mcp:
  # 是否启用 MCP 协议客户端（默认关闭）
  enabled: false
  # 逗号分隔的 name=url 列表，例如：
  # servers: "filesystem=http://localhost:3001,github=http://localhost:3002"
  servers: ""

# ── Data Agent 数据分析配置 ───────────────────────────────────────────────────
data-agent:
  # 数据库方言：h2 | mysql | postgresql
  dialect: h2
  # 数据库/Schema 名称（H2 默认为 PUBLIC）
  db-name: PUBLIC
  # 慢查询阈值（毫秒）：执行时间超过此值记录 WARN 日志，默认 2000ms
  slow-query-threshold-ms: 2000
  # 若需对接外部数据库，在此配置独立数据源：
  # datasource:
  #   url: jdbc:mysql://localhost:3306/mydb?useSSL=false
  #   username: root
  #   password: secret
  #   driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.javacodeagent: DEBUG
    org.springframework.web: INFO

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
