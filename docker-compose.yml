# Local development — H2 embedded database, no external DB required.
# Usage:
#   export LLM_API_KEY=sk-ant-xxx          # required
#   export AGENT_API_KEY=mysecret          # optional; leave blank to disable auth
#   docker compose up --build
version: '3.8'

services:
  app:
    build: .
    image: java-code-agent:latest
    container_name: java-code-agent
    ports:
      - "8080:8080"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      JAVA_OPTS: "-Xmx512m -XX:+UseG1GC"
    volumes:
      # Persist memory files across container restarts
      - agent_memory:/home/appuser/.java-code-agent
      # Optional: mount a host workspace directory for Agent to read/write
      # - ${WORKSPACE_DIR:-./workspace}:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  agent_memory:
